version: "2"

linters:
  settings:
    staticcheck:
      checks:
        # golangci-lint v2 defaults:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        # Repo-specific, to keep the gate equivalent to the previous
        # golangci-lint v1 setup (SA checks only):
        - -ST1001
        - -QF1007
        # Pre-existing ineffective break in the AMQP reader's Notify
        # handling; "fixing" it blindly would change runtime behavior, so
        # it is tracked separately instead of silenced with a rewrite.
        - -SA4011
  exclusions:
    presets:
      # Restores the golangci-lint v1 default exclusions this repo was
      # implicitly linted with (errcheck on Close/Flush/Remove/print…).
      - std-error-handling
